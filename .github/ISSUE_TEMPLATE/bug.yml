name: 문제 수정
description: 재현 가능한 오류나 잘못된 동작을 기록합니다.
title: ""
labels: []
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 현재 동작과 영향을 짧게 설명합니다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: "1. 요청을 보냅니다.\n2. 응답을 확인합니다.\n3. 문제를 확인합니다."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 올바르게 동작했을 때의 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 완료 조건
      placeholder: "- [ ] 수정 결과 확인\n- [ ] 관련 검사 통과"
    validations:
      required: true
