name: 기능 작업
description: 새로운 기능이나 개선 작업을 제안합니다.
title: ""
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: "짧고 쉬운 표현을 사용하고 기술 용어는 억지로 번역하지 않습니다."
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 해결하려는 내용을 한두 문장으로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업
      description: 필요한 작업을 체크리스트로 작성합니다.
      placeholder: "- [ ] 작업 항목"
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 완료 조건
      description: 결과를 확인할 수 있는 기준을 작성합니다.
      placeholder: "- [ ] 확인 가능한 결과"
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: 제외 범위
      description: 이번 작업에서 다루지 않는 내용을 작성합니다.
