name: Deploy server to AWS dev

on:
  workflow_dispatch:
    inputs:
      maintenance_approved:
        description: "One-box only: approve the brief service restart after reviewing this deployment"
        required: false
        default: false
        type: boolean
      engine_enabled:
        description: "Enable actual engine exchange after V14, queue and capacity validation"
        required: false
        default: false
        type: boolean
      engine_connection_approved:
        description: "Approve this exact engine connection deployment after integration validation"
        required: false
        default: false
        type: boolean
      desired_count:
        description: "Spring Boot ECS task count after deployment"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ipgo-server-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      COMPUTE_MODE: ${{ vars.AWS_DEV_COMPUTE_MODE }}
      ECS_SERVICE_NAME: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ipgo-dev-onebox-server' || 'ipgo-dev-server' }}
      ECS_TASK_FAMILY: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ipgo-dev-onebox-server' || 'ipgo-dev-server' }}
      IMAGE_TAG: ${{ github.sha }}${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && '-arm64' || '' }}
    environment: dev
    steps:
      - name: Check deployment mode and maintenance approval
        env:
          MAINTENANCE_APPROVED: ${{ inputs.maintenance_approved }}
          ENGINE_ENABLED: ${{ inputs.engine_enabled }}
          ENGINE_CONNECTION_APPROVED: ${{ inputs.engine_connection_approved }}
        shell: bash
        run: |
          if [[ "$ENGINE_ENABLED" == true && "$ENGINE_CONNECTION_APPROVED" != true ]]; then
            echo '::error::Actual engine exchange requires reviewed V14, queue and integration validation.'
            exit 1
          fi
          case "$COMPUTE_MODE" in
            ''|legacy) ;;
            onebox)
              if [ "$MAINTENANCE_APPROVED" != true ]; then
                echo '::error::One-box deployment restarts this service. Review the image and approve maintenance first.'
                exit 1
              fi
              ;;
            *) echo '::error::AWS_DEV_COMPUTE_MODE must be onebox, legacy, or unset.'; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ipgo-server-deploy
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: login-ecr
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and push immutable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'linux/arm64' || 'linux/amd64' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.login-ecr.outputs.registry }}/ipgo-dev/server:${{ env.IMAGE_TAG }}
      - name: Read current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > "$RUNNER_TEMP/task-definition.json"
      - name: Render image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: server
          image: ${{ steps.login-ecr.outputs.registry }}/ipgo-dev/server:${{ env.IMAGE_TAG }}
          environment-variables: |
            IPGO_API_DOCS_ENABLED=true
            IPGO_ENGINE_ENABLED=${{ inputs.engine_enabled }}
      - name: Configure approved one-box restart
        if: env.COMPUTE_MODE == 'onebox'
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service "$ECS_SERVICE_NAME" \
            --deployment-configuration 'minimumHealthyPercent=0,maximumPercent=100' \
            >/dev/null
      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ipgo-dev-cluster
          wait-for-service-stability: true
      - name: Set approved task count
        env:
          DESIRED_COUNT: ${{ inputs.desired_count }}
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service "$ECS_SERVICE_NAME" \
            --desired-count "$DESIRED_COUNT" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster ipgo-dev-cluster \
            --services "$ECS_SERVICE_NAME"
