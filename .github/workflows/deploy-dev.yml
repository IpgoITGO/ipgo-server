name: Deploy server to AWS dev

on:
  workflow_dispatch:
    inputs:
      desired_count:
        description: "Spring Boot ECS task count after deployment"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ipgo-server-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ipgo-server-deploy
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: login-ecr
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and push immutable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.login-ecr.outputs.registry }}/ipgo-dev/server:${{ github.sha }}
      - name: Read current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ipgo-dev-server \
            --query taskDefinition \
            > "$RUNNER_TEMP/task-definition.json"
      - name: Render image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: server
          image: ${{ steps.login-ecr.outputs.registry }}/ipgo-dev/server:${{ github.sha }}
      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ipgo-dev-server
          cluster: ipgo-dev-cluster
          wait-for-service-stability: true
      - name: Set approved task count
        env:
          DESIRED_COUNT: ${{ inputs.desired_count }}
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service ipgo-dev-server \
            --desired-count "$DESIRED_COUNT" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster ipgo-dev-cluster \
            --services ipgo-dev-server
