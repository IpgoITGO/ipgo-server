name: Deploy server to AWS dev

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional exact source commit already merged into dev; preserves the deployed baseline"
        required: false
        default: ""
        type: string
      expected_sha:
        description: "Full 40-character server SHA approved for this deployment"
        required: true
        type: string
      continuous_insight_approved:
        description: "Approve ongoing insight; monthly quota remains enabled unless separately waived"
        required: false
        default: false
        type: boolean
      unlimited_insight_approved:
        description: "Explicitly approve ongoing LLM costs without the monthly USD10 quota"
        required: false
        default: false
        type: boolean
      insight_starts_at:
        description: "UTC start: only explanations created since this instant belong to the demo"
        required: false
        default: ""
        type: string
      insight_expires_at:
        description: "UTC deadline for demo calls (required unless continuous mode approved, within 24h)"
        required: false
        default: ""
        type: string
      insight_enabled:
        description: "Queue new AI explanations (requires engine and explicit insight approval)"
        required: false
        default: false
        type: boolean
      batch_insight_enabled:
        description: "Allow explicit fixed master batch 1921-1925 sharing the original 812-816 lifetime five calls; no background generation"
        required: false
        default: false
        type: boolean
      batch_insight_approved:
        description: "Approve the new fixed master batch scope and shared old/new maximum five possible paid attempts for this SHA"
        required: false
        default: false
        type: boolean
      single_result_insight_enabled:
        description: "Allow explicit regeneration of result 811 only, lifetime maximum one attempt; automatic insight stays off"
        required: false
        default: false
        type: boolean
      single_result_insight_approved:
        description: "Approve the single result 811 attempt and its possible LLM cost for this SHA"
        required: false
        default: false
        type: boolean
      insight_approved:
        description: "Approve paid insight generation for this exact SHA and reviewed scope"
        required: false
        default: false
        type: boolean
      insight_worker_enabled:
        description: "Run the insight worker; keep false for deployment without automatic LLM calls"
        required: false
        default: false
        type: boolean
      maintenance_approved:
        description: "One-box only: approve the brief service restart after reviewing this deployment"
        required: false
        default: false
        type: boolean
      engine_enabled:
        description: "Enable actual engine exchange after V14, queue and capacity validation"
        required: false
        default: false
        type: boolean
      engine_connection_approved:
        description: "Approve this exact engine connection deployment after integration validation"
        required: false
        default: false
        type: boolean
      desired_count:
        description: "Spring Boot ECS task count after deployment"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ipgo-server-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      MAINTENANCE_APPROVED: ${{ inputs.maintenance_approved }}
      ENGINE_ENABLED: ${{ inputs.engine_enabled }}
      ENGINE_CONNECTION_APPROVED: ${{ inputs.engine_connection_approved }}
      CONTINUOUS_INSIGHT_APPROVED: ${{ inputs.continuous_insight_approved }}
      UNLIMITED_INSIGHT_APPROVED: ${{ inputs.unlimited_insight_approved }}
      INSIGHT_STARTS_AT: ${{ inputs.insight_starts_at }}
      INSIGHT_EXPIRES_AT: ${{ inputs.insight_expires_at }}
      INSIGHT_ENABLED: ${{ inputs.insight_enabled }}
      BATCH_INSIGHT_ENABLED: ${{ inputs.batch_insight_enabled }}
      BATCH_INSIGHT_APPROVED: ${{ inputs.batch_insight_approved }}
      SINGLE_RESULT_INSIGHT_ENABLED: ${{ inputs.single_result_insight_enabled }}
      SINGLE_RESULT_INSIGHT_APPROVED: ${{ inputs.single_result_insight_approved }}
      INSIGHT_APPROVED: ${{ inputs.insight_approved }}
      INSIGHT_WORKER_ENABLED: ${{ inputs.insight_worker_enabled }}
      DESIRED_COUNT: ${{ inputs.desired_count }}
      COMPUTE_MODE: ${{ vars.AWS_DEV_COMPUTE_MODE }}
      ECS_SERVICE_NAME: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ipgo-dev-onebox-server' || 'ipgo-dev-server' }}
      ECS_TASK_FAMILY: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'ipgo-dev-onebox-server' || 'ipgo-dev-server' }}
      IMAGE_TAG: ${{ inputs.source_sha || github.sha }}${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && '-arm64' || '' }}
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact approved source merged into dev
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin dev
          git merge-base --is-ancestor HEAD origin/dev

      - name: Validate approved deployment before external writes
        env:
          ENGINE_BASE_URL: ${{ vars.AWS_AI_ENGINE_BASE_URL }}
        run: python3 scripts/deployment/render_dev_task.py validate
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ipgo-server-deploy
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: login-ecr
      - name: Look up immutable SHA image
        id: image_lookup
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipgo-dev/server
        run: python3 scripts/deployment/check_ecr_image.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.image_lookup.outputs.exists == 'false'
      - name: Build and push immutable image
        if: steps.image_lookup.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ vars.AWS_DEV_COMPUTE_MODE == 'onebox' && 'linux/arm64' || 'linux/amd64' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.image_lookup.outputs.image }}
      - name: Verify immutable image before deployment
        id: verified_image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ipgo-dev/server
          EXPECTED_IMAGE_DIGEST: ${{ steps.image_lookup.outputs.digest }}
        run: python3 scripts/deployment/check_ecr_image.py --require-present
      - name: Read current task definition
        run: |
          umask 077
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > "$RUNNER_TEMP/task-definition.json"
      - name: Render approved image and engine insight settings
        id: render
        env:
          ENGINE_BASE_URL: ${{ vars.AWS_AI_ENGINE_BASE_URL }}
          SERVER_IMAGE: ${{ steps.verified_image.outputs.image }}
        run: |
          python3 scripts/deployment/render_dev_task.py render \
            --source "$RUNNER_TEMP/task-definition.json" \
            --output "$RUNNER_TEMP/server-task-definition.json" \
            --image "$SERVER_IMAGE"
          echo "task-definition=$RUNNER_TEMP/server-task-definition.json" >> "$GITHUB_OUTPUT"
      - name: Configure approved one-box restart
        if: env.COMPUTE_MODE == 'onebox'
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service "$ECS_SERVICE_NAME" \
            --deployment-configuration 'minimumHealthyPercent=0,maximumPercent=100' \
            >/dev/null
      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ipgo-dev-cluster
          wait-for-service-stability: true
      - name: Set approved task count
        env:
          DESIRED_COUNT: ${{ inputs.desired_count }}
        run: |
          aws ecs update-service \
            --cluster ipgo-dev-cluster \
            --service "$ECS_SERVICE_NAME" \
            --desired-count "$DESIRED_COUNT" \
            >/dev/null
          aws ecs wait services-stable \
            --cluster ipgo-dev-cluster \
            --services "$ECS_SERVICE_NAME"
