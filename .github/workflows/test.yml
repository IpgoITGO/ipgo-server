name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify deployment gates and task preservation without AWS
        run: python3 -m unittest discover -s scripts/testing -p 'test_*.py' -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ipgo-server:ci
          cache-from: type=gha,scope=server-${{ runner.arch }},timeout=60s
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=server-{0},timeout=60s,ignore-error=true', runner.arch) || '' }}


  arm-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify server and engine transactions on native ARM
        run: ./gradlew --no-daemon --max-workers=2 test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native ARM runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ipgo-server:arm-check
          cache-from: type=gha,scope=server-${{ runner.arch }},timeout=60s
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=server-{0},timeout=60s,ignore-error=true', runner.arch) || '' }}
