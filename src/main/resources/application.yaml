spring:
  application:
    name: ipgo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

ipgo:
  upload:
    directory: ${IPGO_UPLOAD_DIR:./storage/uploads}
  mail:
    from: ${IPGO_MAIL_FROM:}
