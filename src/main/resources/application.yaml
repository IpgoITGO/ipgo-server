spring:
  application:
    name: ipgo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  jackson:
    deserialization:
      # 정수 칸(리드타임·입고 단위 등)에 1.5 같은 소수를 보내면 잘라내지 않고 400으로 거절한다.
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

ipgo:
  auth:
    jwt-secret: ${IPGO_JWT_SECRET:}
    cookie-secure: ${IPGO_AUTH_COOKIE_SECURE:true}
  upload:
    directory: ${IPGO_UPLOAD_DIR:./storage/uploads}
  mail:
    from: ${IPGO_MAIL_FROM:}
