spring:
  application:
    name: ipgo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

ipgo:
  upload:
    directory: ${IPGO_UPLOAD_DIR:./storage/uploads}
