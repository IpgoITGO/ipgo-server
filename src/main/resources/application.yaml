spring:
  application:
    name: ipgo-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  jackson:
    deserialization:
      # 정수 칸(리드타임·입고 단위 등)에 1.5 같은 소수를 보내면 잘라내지 않고 400으로 거절한다.
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: ${IPGO_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${IPGO_API_DOCS_ENABLED:false}
    persist-authorization: false
    try-it-out-enabled: false
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  paths-to-match: /api/**
  packages-to-scan: com.ipgo.server.controller
  show-actuator: false

ipgo:
  payment:
    enabled: ${IPGO_PAYMENT_ENABLED:false}
    secret-key: ${IPGO_PAYMENT_SECRET_KEY:}
    merchant-id: ${IPGO_PAYMENT_MERCHANT_ID:}
    refund-policy:
      # #208 결제 완료 후 회원 직접 환불 제한. 프론트가 결제 화면 고지를 넣고 환불 버튼을 뺀 배포와 같이 true로 켠다.
      restricted: ${IPGO_PAYMENT_REFUND_RESTRICTED:false}
  billing:
    enabled: ${IPGO_BILLING_ENABLED:false}
    worker-enabled: ${IPGO_BILLING_WORKER_ENABLED:false}
    mode: ${IPGO_BILLING_MODE:TEST}
    secret-key: ${IPGO_TOSS_SECRET_KEY:}
    security-key: ${IPGO_TOSS_SECURITY_KEY:}
    encryption-key: ${IPGO_BILLING_ENCRYPTION_KEY:}
    lookup-key: ${IPGO_BILLING_LOOKUP_KEY:}
    merchant-id: ${IPGO_TOSS_MERCHANT_ID:}
    return-origin: ${IPGO_BILLING_RETURN_ORIGIN:http://localhost:5173}
  insight:
    batch-enabled: ${IPGO_INSIGHT_BATCH_ENABLED:false}
    single-result-enabled: ${IPGO_INSIGHT_SINGLE_RESULT_ENABLED:false}
    enabled: ${IPGO_INSIGHT_ENABLED:false}
    worker-enabled: ${IPGO_INSIGHT_WORKER_ENABLED:true}
    timeout: ${IPGO_INSIGHT_TIMEOUT:15s}
    poll-delay-ms: ${IPGO_INSIGHT_POLL_DELAY_MS:1000}
  engine:
    enabled: ${IPGO_ENGINE_ENABLED:false}
    base-url: ${IPGO_ENGINE_BASE_URL:}
    scenario-timeout: ${IPGO_SCENARIO_TIMEOUT:10s}
    transport-enabled: ${IPGO_ENGINE_TRANSPORT_ENABLED:true}
    sqs-endpoint: ${IPGO_SQS_ENDPOINT:}
    jobs-queue-url: ${IPGO_JOBS_QUEUE_URL:}
    results-queue-url: ${IPGO_RESULTS_QUEUE_URL:}
  auth:
    jwt-secret: ${IPGO_JWT_SECRET:}
    cookie-secure: ${IPGO_AUTH_COOKIE_SECURE:true}
  signup:
    # #206 가입 동의 · 사업자등록번호. false(전환 기간)는 보낸 값만 검사하고, 프론트 동의 화면 배포 뒤 true로 바꾼다.
    strict: ${IPGO_SIGNUP_STRICT:false}
    agreement-version: 2026-11-v1
  push:
    # #190 Web Push VAPID 공개키(base64url). 비어 있으면 알림 등록 API가 503 PUSH_UNAVAILABLE을 돌려준다.
    public-key: ${IPGO_PUSH_PUBLIC_KEY:}
    delivery:
      enabled: ${IPGO_PUSH_DELIVERY_ENABLED:false}
      private-key: ${IPGO_PUSH_PRIVATE_KEY:}
      subject: ${IPGO_PUSH_SUBJECT:https://ipgo-dev.iwhya.kr}
      poll-delay-ms: ${IPGO_PUSH_POLL_DELAY_MS:60000}
  upload:
    storage: ${IPGO_UPLOAD_STORAGE:local}
    directory: ${IPGO_UPLOAD_DIR:./storage/uploads}
    bucket: ${IPGO_UPLOAD_BUCKET:}
    database-max-bytes: ${IPGO_UPLOAD_DATABASE_MAX_BYTES:268435456}
  mail:
    from: ${IPGO_MAIL_FROM:}
